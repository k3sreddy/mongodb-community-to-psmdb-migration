[defaults]
inventory            = ./inventory/prod-live.yml
roles_path           = ./roles
collections_path     = ./collections
host_key_checking    = True
interpreter_python   = auto_silent
retry_files_enabled  = False
stdout_callback      = default
display_skipped_hosts = False
# Optional niceties if community.general / ansible.posix are installed:
# stdout_callback    = yaml
# callbacks_enabled  = profile_tasks
vault_password_file  = ~/.ansible-vault-pass
forks                = 5
# Destructive phases must stop the whole run on the first failure, not limp on.
any_errors_fatal     = True

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=10m -o ConnectTimeout=20
